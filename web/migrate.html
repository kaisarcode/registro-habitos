<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1419"><title>Registro Hábitos</title><style>body{background:#0b1419;color:#b9cbd0;font:16px system-ui;padding:24px}button{background:#57d7b2;color:#09231d;border:0;padding:12px;border-radius:10px}</style></head>
<body><p id="status">Abriendo Registro Hábitos…</p><button id="proceed" hidden>Continuar sin importar los datos anteriores</button>
<script>
(function () {
"use strict";
const TARGET="https://appassets.androidplatform.net/index.html";
const FLAG="rh-https-migration-v1";
const status=document.getElementById("status"), proceed=document.getElementById("proceed");
const go=()=>location.replace(TARGET);
if (localStorage.getItem(FLAG)==="ok"){go();return;}
let backup={version:1,entries:[],reminders:[],categories:[]}, destination=null;
function parse(key,fall){try{return JSON.parse(localStorage.getItem(key)||"null")||fall}catch{return fall}}
backup.reminders=parse("registro-habitos-reminders",[]);
backup.categories=parse("rh-categories",[]);
function fail(error){status.textContent="No se pudieron recuperar automáticamente los datos anteriores: "+error+". Podés seguir sin borrarlos.";proceed.hidden=false;}
proceed.onclick=go;
if (!window.indexedDB){fail("IndexedDB no disponible");return;}
const request=indexedDB.open("registro-habitos",1);
request.onerror=()=>fail("No se puede abrir la base anterior");
request.onupgradeneeded=()=>{};
request.onsuccess=()=>{
 const db=request.result;
 if (!db.objectStoreNames.contains("entries")){db.close();localStorage.setItem(FLAG,"ok");go();return;}
 const tx=db.transaction("entries","readonly");
 const query=tx.objectStore("entries").getAll();
 query.onerror=()=>fail("No se pueden leer los registros anteriores");
 query.onsuccess=()=>{
  backup.entries=query.result||[];db.close();
  if (!backup.entries.length && !backup.reminders.length && !backup.categories.length){localStorage.setItem(FLAG,"ok");go();return;}
  status.textContent="Conservando tus registros anteriores…";
  destination=document.createElement("iframe");
  destination.style.display="none";
  destination.src=TARGET+"?migration=1";
  document.body.append(destination);
 };
};
window.addEventListener("message",event=>{
 if(event.origin!=="https://appassets.androidplatform.net"||event.source!==destination?.contentWindow)return;
 if(event.data?.type==="rh-ready")destination.contentWindow.postMessage({type:"rh-migrate",backup},event.origin);
 if(event.data?.type==="rh-complete"){localStorage.setItem(FLAG,"ok");go();}
 if(event.data?.type==="rh-error")fail(event.data.message||"Error de importación");
});
})();
</script></body></html>
